<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>

    <style> 
        body{
            background-color: rgb(84, 84, 151);
            color: white;
            font: normal 20px arial;
            text-align: center;
        }

<body>

        document.write(`Bem Vindo ${nome}`)
